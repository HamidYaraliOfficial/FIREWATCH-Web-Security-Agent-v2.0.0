services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firewatch
      POSTGRES_USER: firewatch
      POSTGRES_PASSWORD: firewatch
    ports: ["5432:5432"]
    volumes: [firewatch_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U firewatch -d firewatch"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://firewatch:firewatch@db:5432/firewatch
      ALLOW_PRIVATE_TARGETS: "false"
      REQUIRE_SCOPE_ACK: "true"
      MAX_PAGES: "300"
      MAX_DEPTH: "8"
      MAX_ENDPOINTS: "2000"
      REQUEST_TIMEOUT_SECONDS: "15"
      REQUEST_DELAY_MS: "150"
      MAX_CONCURRENCY: "6"
      RESPECT_ROBOTS: "true"
      ENABLE_BROWSER: "true"
      ENABLE_API_INTROSPECTION: "true"
      REPORT_DIR: /data/reports
      CORS_ORIGINS: http://localhost:8000
    volumes: [firewatch_reports:/data/reports]
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000"]
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["external-worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://firewatch:firewatch@db:5432/firewatch
      ALLOW_PRIVATE_TARGETS: "false"
      REPORT_DIR: /data/reports
    volumes: [firewatch_reports:/data/reports]
    depends_on: {db: {condition: service_healthy}}
    command: ["python","-m","app.worker"]
  demo:
    build: {context: ./demo_target}
    profiles: ["demo"]
    ports: ["8765:9000"]
volumes:
  firewatch_pg:
  firewatch_reports:
